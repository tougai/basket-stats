<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Deep midnight obsidian / dark navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="40%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Warm Ambient Floor Reflection / Aura -->
    <radialGradient id="warmAura" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#FF5A00" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#FF3D00" stop-opacity="0.10" />
      <stop offset="85%" stop-color="#00D2FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Basketball Sphere 3D Shading -->
    <radialGradient id="ballShading" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFBA66" />
      <stop offset="20%" stop-color="#FF7A00" />
      <stop offset="55%" stop-color="#EA4E00" />
      <stop offset="82%" stop-color="#B83200" />
      <stop offset="96%" stop-color="#661900" />
      <stop offset="100%" stop-color="#3D0B00" />
    </radialGradient>

    <!-- Specular Highlight Top-Left -->
    <radialGradient id="specularGlow" cx="34%" cy="26%" r="38%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#FFE0B2" stop-opacity="0.22" />
      <stop offset="80%" stop-color="#FF8C00" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Rim Lighting (Bottom-Right Bounce Light from stats graph) -->
    <linearGradient id="cyanRim" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.75" />
      <stop offset="15%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Cyan Telemetry Arc Gradient -->
    <linearGradient id="cyanArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Ball Drop Shadow -->
    <radialGradient id="ballShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Trajectory & Stats Nodes -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle blur for shadow and backdrop -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" />
    </filter>

    <!-- Clip Path for the Ball Sphere (Radius 300) -->
    <clipPath id="ballClip">
      <circle cx="512" cy="512" r="300" />
    </clipPath>
  </defs>

  <!-- ================= 1. BACKGROUND ================= -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Subtle Basketball Half-Court Telemetry Lines in Background -->
  <g opacity="0.16" stroke="#38BDF8" stroke-width="2.5" fill="none">
    <!-- Center circle / 3PT arc outline -->
    <circle cx="512" cy="512" r="430" stroke-dasharray="10 14" />
    <circle cx="512" cy="512" r="475" opacity="0.4" />
    <!-- Cross axes with tick marks -->
    <line x1="84" y1="512" x2="940" y2="512" stroke-dasharray="8 12" opacity="0.3" />
    <line x1="512" y1="84" x2="512" y2="940" stroke-dasharray="8 12" opacity="0.3" />
    <!-- Corner coordinate accents -->
    <path d="M 160,180 L 160,160 L 180,160" stroke-width="3" opacity="0.6" />
    <path d="M 864,180 L 864,160 L 844,160" stroke-width="3" opacity="0.6" />
    <path d="M 160,844 L 160,864 L 180,864" stroke-width="3" opacity="0.6" />
    <path d="M 864,844 L 864,864 L 844,864" stroke-width="3" opacity="0.6" />
  </g>

  <!-- Ambient Light Halo behind Ball -->
  <circle cx="512" cy="512" r="460" fill="url(#warmAura)" />

  <!-- Ball Soft Ground Shadow -->
  <ellipse cx="512" cy="836" rx="260" ry="50" fill="url(#ballShadow)" />

  <!-- ================= 2. BASKETBALL HERO ================= -->
  <g id="basketball">
    <!-- Main 3D Orange Sphere -->
    <circle cx="512" cy="512" r="300" fill="url(#ballShading)" />

    <!-- Clipped Seams & Shading Layers -->
    <g clip-path="url(#ballClip)">
      <!-- Inner Edge Vignette (3D depth / ambient occlusion) -->
      <circle cx="512" cy="512" r="300" fill="none" stroke="#220600" stroke-width="28" opacity="0.8" />

      <!-- ================= BLACK SEAMS (RIBS) ================= -->
      <!-- Vertical Central Seam (slight 3D curvature) -->
      <path d="M 512,212 Q 468,512 512,812"
            fill="none" stroke="#160500" stroke-width="19" stroke-linecap="round" />
      <path d="M 512,212 Q 468,512 512,812"
            fill="none" stroke="#FFA352" stroke-width="2.5" opacity="0.4" />

      <!-- Horizontal Equator Seam -->
      <path d="M 212,512 Q 512,472 812,512"
            fill="none" stroke="#160500" stroke-width="19" stroke-linecap="round" />
      <path d="M 212,512 Q 512,472 812,512"
            fill="none" stroke="#FFA352" stroke-width="2.5" opacity="0.4" />

      <!-- Left Classic Curved Seam -->
      <path d="M 298,268 Q 456,512 298,756"
            fill="none" stroke="#160500" stroke-width="19" stroke-linecap="round" />
      <path d="M 298,268 Q 456,512 298,756"
            fill="none" stroke="#FFA352" stroke-width="2.5" opacity="0.35" />

      <!-- Right Classic Curved Seam -->
      <path d="M 726,268 Q 568,512 726,756"
            fill="none" stroke="#160500" stroke-width="19" stroke-linecap="round" />
      <path d="M 726,268 Q 568,512 726,756"
            fill="none" stroke="#FFA352" stroke-width="2.5" opacity="0.45" />

      <!-- Soft Gloss Top Highlight -->
      <circle cx="512" cy="512" r="300" fill="url(#specularGlow)" />

      <!-- Bottom-Right Cyan Reflection Glow -->
      <circle cx="512" cy="512" r="300" fill="url(#cyanRim)" />
    </g>

    <!-- Outer Rim Highlight for Crisp Silhouette -->
    <circle cx="512" cy="512" r="300" fill="none" stroke="#FFA04D" stroke-width="3" opacity="0.65" />
  </g>

  <!-- ================= 3. STATS & TELEMETRY ARC ================= -->
  <g id="telemetry_arc">
    <!-- Glowing Halo around Trajectory Arc -->
    <path d="M 180,680 C 160,370 410,185 725,175 C 840,170 900,230 875,310"
          fill="none" stroke="#00E5FF" stroke-width="26" opacity="0.3" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Sharp Main Trajectory Arc -->
    <path d="M 180,680 C 160,370 410,185 725,175 C 840,170 900,230 875,310"
          fill="none" stroke="url(#cyanArc)" stroke-width="9" stroke-linecap="round" />

    <!-- Data Nodes along curve (Stats points) -->
    <circle cx="215" cy="485" r="7" fill="#38BDF8" opacity="0.9" />
    <circle cx="310" cy="315" r="8" fill="#00E5FF" opacity="0.95" />
    <circle cx="485" cy="210" r="9" fill="#E0F2FE" />

    <!-- Shooting Target Reticle at Apex (725, 175) -->
    <g transform="translate(725, 175)" filter="url(#neonGlow)">
      <!-- Target rings -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6 6" opacity="0.7" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#38BDF8" stroke-width="3.5" opacity="0.9" />
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" />

      <!-- Crosshairs -->
      <line x1="0" y1="-44" x2="0" y2="-29" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
      <line x1="0" y1="29" x2="0" y2="44" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-44" y1="0" x2="-29" y2="0" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
      <line x1="29" y1="0" x2="44" y2="0" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Mini Analytics Bar Indicator in Bottom Left -->
    <g transform="translate(145, 755)" opacity="0.85">
      <rect x="0" y="24" width="8" height="24" rx="4" fill="#38BDF8" opacity="0.5" />
      <rect x="14" y="14" width="8" height="34" rx="4" fill="#00E5FF" opacity="0.7" />
      <rect x="28" y="0" width="8" height="48" rx="4" fill="#F97316" />
      <rect x="42" y="8" width="8" height="40" rx="4" fill="#FF8C00" opacity="0.9" />
    </g>
  </g>
</svg>